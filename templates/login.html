{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center align-items-center vh-75 fade-in-anim">
    <div class="col-md-5 col-lg-4">
        <div class="glass-card p-5 text-center">
            
            <div class="mb-4">
                <i class="bi bi-fingerprint text-accent" style="font-size: 3rem;"></i>
                <h2 class="brand-font mt-2 text-white">Factory Access</h2>
                <p class="text-muted small">Auth via Secure Subsystem</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}" class="text-start">
                <div class="mb-3">
                    <label class="form-label text-secondary small text-uppercase fw-bold">Manager Email</label>
                    <input type="email" name="email" class="form-control industrial-input" placeholder="manager@ecothread.com" required value="manager@ecothread.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary small text-uppercase fw-bold">Access Token</label>
                    <div class="input-group">
                        <input type="password" name="password" id="passwordField" class="form-control industrial-input" placeholder="Enter credentials" required value="Textile2026!">
                        <button class="btn btn-outline-secondary px-3" type="button" id="togglePswd"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-accent fw-bold text-dark py-2">INITIALIZE SESSION</button>
                </div>
            </form>
            
        </div>
    </div>
</div>

{% endblock %}
